[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [
    "env",
    "scripts/probes",
    "src/scrapers/disabled",
    "src/web/dashboard.py.bak*",
]

[tool.ruff.lint]
# Reglas pragmáticas: pyflakes + pycodestyle + isort + bugbear básico.
# Evitamos D (docstrings) y ANN (anotaciones) para no romper código legacy.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # línea muy larga (preferimos black-like, no forzamos)
    "B008",  # function call in default arg (Flask/FastAPI patterns)
    "B904",  # raise from
    "E402",  # module-level import not at top (config side-effects)
    "E741",  # ambiguous variable names (l, I) — usados en math
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "B011"]
"src/web/dashboard.py" = ["F401", "F841"]  # monolito legacy, migración gradual

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
