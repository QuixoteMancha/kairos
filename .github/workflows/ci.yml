name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check . --output-format=github
        continue-on-error: true  # 616 legacy issues, no bloqueante hasta limpiar dashboard.py
      - name: ruff format --check
        run: ruff format --check .
        continue-on-error: true  # rollout gradual del formatter

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: |
          pytest -q \
            --cov=src/math --cov=src/core --cov=src/database \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=20
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install scanners
        run: pip install pip-audit bandit
      - name: pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true  # informativo hasta tener deps limpias
      - name: bandit (HIGH severity only)
        run: bandit -r src/ -ll -ii -x src/web/dashboard.py.bak,src/web/dashboard.py.bak
        continue-on-error: true
