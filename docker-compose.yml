version: '3.8'

services:
  kairos:
    image: kairos:latest
    container_name: kairos
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

networks:
  kairos_net:
    name: kairos_kairos_net

volumes:
  kairos_data:
    name: kairos_kairos_data