x-kairos-db-environment: &kairos-db-environment
  KAIROS_DB_BACKEND: postgresql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: kairos
  DB_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
  DB_NAME: kairos
  DB_HISTORICAL_NAME: kairos_historical

x-kairos-db-depends: &kairos-db-depends
  kairos_migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    container_name: kairos_postgres
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: kairos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos && pg_isready -U kairos -d kairos_historical"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-historical.sql:ro

  kairos_migrate:
    image: kairos:latest
    build: .
    command: ["python", "-m", "database.migrate"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - kairos_net

  kairos:
    image: kairos:latest
    container_name: kairos
    build: .
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # Sin esto, kairos.py corre una vez y termina -- en producción
      # queremos loop indefinido (ver kairos.py). 300s = 5 min entre scans;
      # un scan de tenis en vivo ya toma ~1-2 min (fetch de mercados +
      # prefetch paralelo de historial Flashscore), así que un intervalo
      # más corto encolaría scans sin necesidad.
      KAIROS_SCAN_INTERVAL_SECONDS: "300"
      # Las bases activa e histórica son bases PostgreSQL separadas.
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      # Volumen "definitivo": contabilidad operativa (LimitArbSignal hoy,
      # órdenes/fills/PnL más adelante).
      - kairos_data:/data
      # Volumen viejo rescatado: datos de referencia/histórica para
      # calibrar modelos (KalshiMarketTick/CryptoPriceSnapshot/TeamRating
      # reales, ver database/models_historical.py). Nadie escribe acá
      # todavía (sin collector/worker wireado) -- montado para que el
      # schema/conexión ya estén listos cuando se construya esa pieza.
      - kairos_data_historical:/data_historical
      # Disco externo (/mnt/storage2 en la mini-pc, confirmado por el
      # usuario 2026-07-31) montado read-only -- el motor solo CONSULTA
      # la data archivada (ver outer_apis/sports/tennis/
      # volatility_calibration.py), nunca escribe ahí (eso lo hace
      # únicamente tennis_history_archiver_worker).
      - /mnt/storage2/kairos_archive:/archive:ro

  tennis_history_archiver_worker:
    image: kairos:latest
    container_name: kairos_tennis_history_archiver_worker
    build: .
    command: ["python", "-m", "workers.tennis_history_archiver_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 1h -- ver workers/tennis_history_archiver_worker.py, el chequeo
      # de tamaño de disco no necesita alta frecuencia.
      TENNIS_ARCHIVER_INTERVAL_SECONDS: "3600"
      TENNIS_ARCHIVE_DB_PATH: "/archive/kairos_tennis_archive.db"
      POSTGRES_DATA_MOUNT: "/postgres_data"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical
      - postgres_data:/postgres_data:ro
      # Este es el ÚNICO servicio con permiso de ESCRITURA en el disco
      # externo -- todo lo demás lo monta read-only.
      - /mnt/storage2/kairos_archive:/archive

  tennis_player_catalog_backfill_worker:
    image: kairos:latest
    container_name: kairos_tennis_player_catalog_backfill_worker
    build: .
    # 2026-08-16, pedido explícito del usuario: "un worker que tenga
    # threads para backfillear los players que corra constantemente" --
    # ver workers/tennis_player_catalog_backfill_worker.py. Recorre el
    # catálogo COMPLETO de TennisExplorer (todos los países), no solo un
    # roster top-N -- una pasada completa toma del orden de días, corre
    # indefinidamente en background (idempotente, cada pasada solo
    # completa lo que falte).
    command: ["python", "-m", "workers.tennis_player_catalog_backfill_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # Threads en paralelo por jugador YA descubierto (el descubrimiento
      # del catálogo -- países/paginación -- sigue siendo secuencial a
      # propósito, ver docstring del worker). 4 = conservador para no
      # saturar el throttle real de TennisExplorer entre TODOS los
      # workers que ya lo comparten (tennis_match_history_sync_worker,
      # tennis_match_tick_worker).
      TENNIS_CATALOG_BACKFILL_MAX_WORKERS: "4"
      # 1h entre pasadas COMPLETAS del catálogo -- en la práctica casi
      # nunca se alcanza a disparar (una pasada real tarda mucho más),
      # solo importa si el catálogo ya está casi completo.
      TENNIS_CATALOG_BACKFILL_INTERVAL_SECONDS: "3600"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  brightdata_ip_watcher_worker:
    image: kairos:latest
    container_name: kairos_brightdata_ip_watcher_worker
    build: .
    command: ["python", "-m", "workers.brightdata_ip_watcher_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 5min -- ver workers/brightdata_ip_watcher_worker.py. No necesita
      # ningún volumen (no toca DB, solo la API de BrightData + servicios
      # públicos de IP).
      BRIGHTDATA_WATCHER_INTERVAL_SECONDS: "300"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_match_tick_worker:
    image: kairos:latest
    container_name: kairos_tennis_match_tick_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_tick_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 60s -- "minuto a minuto", pedido explícito del usuario. Ver
      # workers/tennis_match_tick_worker.py.
      TENNIS_TICK_INTERVAL_SECONDS: "60"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical
      # kairos_data (`db`/DB_PATH) -- 2026-08-11: la fusión con
      # set1_favorite_reaction_worker (2026-08-02) se REVIRTIÓ, pedido
      # explícito del usuario ("no lo usaremos de esa manera, más
      # adelante habrá un worker con ejecución real de estrategias").
      # El volumen sigue haciendo falta igual: `run_once` ahora chequea
      # el circuit-breaker global (`SystemHaltState`, ver
      # database/accounting/systemhaltstate.py, 2026-08-11).
      - kairos_data:/data

  tennis_match_history_sync_worker:
    image: kairos:latest
    container_name: kairos_tennis_match_history_sync_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_history_sync_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      TENNIS_HISTORY_SYNC_SLEEP_S: "300"
      TENNIS_HISTORY_SYNC_BATCH_SIZE: "10"
      TENNIS_HISTORY_SYNC_STATS_LIMIT: "5"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  mlb_match_tick_worker:
    image: kairos:latest
    container_name: kairos_mlb_match_tick_worker
    build: .
    command: ["python", "-m", "workers.mlb_match_tick_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      MLB_TICK_INTERVAL_SECONDS: "60"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  market_arb_websocket_scanner:
    image: kairos:latest
    container_name: kairos_market_arb_websocket_scanner
    build: .
    # 2026-08-02, pedido explícito del usuario: "que el scan vaya
    # guardando las oportunidades market arb detectadas, mediante
    # websocket". Necesita /data/secrets/kalshi_key.pem (credenciales
    # reales de Kalshi, ver outer_apis/kalshi/auth.py) -- por eso monta
    # `kairos_data` (alias de kairos_data_v2), NO
    # kairos_data_historical. Solo lectura/registro, no coloca órdenes
    # -- línea roja del proyecto sin cambios.
    command: ["python", "-m", "workers.market_arb_websocket_scanner"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      MARKET_ARB_WS_REGISTRY_REFRESH_SECONDS: "900"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

  mls_worker:
    image: kairos:latest
    container_name: kairos_mls_worker
    build: .
    command: ["python", "-m", "workers.mls_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 6h -- MLS Elo solo cambia con resultados reales, no hace falta
      # refrescar más seguido (ver workers/mls_worker.py).
      MLS_REFRESH_INTERVAL_SECONDS: "21600"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical

  outcome_observer_worker:
    image: kairos:latest
    container_name: kairos_outcome_observer_worker
    build: .
    command: ["python", "-m", "workers.outcome_observer_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 30min -- ver ventana de observación (2h-30d) documentada en el
      # docstring del worker; el intervalo del loop solo controla cada
      # cuánto se re-chequean señales YA elegibles, no la ventana en sí.
      OUTCOME_OBSERVER_INTERVAL_SECONDS: "1800"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

  limitarb_monitor_worker:
    image: kairos:latest
    container_name: kairos_limitarb_monitor_worker
    build: .
    command: ["python", "-m", "workers.limitarb_monitor_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 30s -- see workers/limitarb_monitor_worker.py: rule A counts one
      # "attempt" per cycle where the limit leg isn't marketable yet, 3
      # attempts triggers timeout, so the interval directly drives that
      # timing (user-confirmed 30s).
      LIMITARB_MONITOR_INTERVAL_SECONDS: "30"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

  historical_collector_worker:
    image: kairos:latest
    container_name: kairos_historical_collector_worker
    build: .
    command: ["python", "-m", "workers.historical_collector_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 5min -- ticks/candles son time-sensitive (crypto_15m resuelve en
      # ~15min), ver workers/historical_collector_worker.py.
      HISTORICAL_COLLECTOR_INTERVAL_SECONDS: "300"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical

  fill_verification_worker:
    image: kairos:latest
    container_name: kairos_fill_verification_worker
    build: .
    command: ["python", "-m", "workers.fill_verification_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 10min -- retrospective analysis, not time-critical like
      # limitarb_monitor_worker's 30s (see workers/fill_verification_worker.py).
      FILL_VERIFICATION_INTERVAL_SECONDS: "600"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

  api:
    image: kairos:latest
    container_name: kairos_api
    build: .
    command: ["python", "-m", "inner_api.server"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 8765 -- puerto legacy pre-"extreme makeover" (había Flask acá
      # antes); otro proyecto del ecosistema (Aegis) ya tiene una
      # referencia apuntando acá, confirmado libre en la mini-pc (ver
      # inner_api/server.py module docstring).
      API_PORT: "8765"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    ports:
      - "8765:8765"
    volumes:
      - kairos_data:/data

networks:
  kairos_net:
    name: kairos_kairos_net

volumes:
  postgres_data:
    name: kairos_postgres_data
  kairos_data:
    name: kairos_data_v2
  kairos_data_historical:
    name: kairos_kairos_data
