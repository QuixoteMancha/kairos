# Kairos · Stack Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Levanta:
#   - kairos  : Motor autónomo (Engine) + Web (visualización) en un solo proceso.
#
# Filosofía:
#   - El **core/motor** (KairosEngine) funciona **automáticamente** con todo:
#     scans, auto-bets (con rotación/jitter/feedback), live hedge, settlement,
#     rebalance, etc. No necesita que nadie abra el navegador.
#   - La **web** es **visualización** (balances, arbs detectados, historial,
#     partidos, etc.) + algo de control manual. No es el cerebro.
#
# En el contenedor se inicia todo junto con `kairos run` (o `dashboard`).
# El motor corre solo; la web sirve los datos.
#
# Uso:
#   docker compose up -d
#   docker compose logs -f kairos
#
# Puertos:
#   8765 → Web + API
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  kairos:
    image: kairos:latest
    container_name: kairos
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # Opcional: Limita a Ollama a usar, por ejemplo, 4 o 6 hilos de la CPU
      # para dejar el resto de los núcleos libres para los escaneos intensivos de Kairos.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NOPRUNE=1
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - kairos_net

networks:
  kairos_net:
    name: kairos_kairos_net

volumes:
  kairos_data:
    name: kairos_kairos_data
  ollama_storage:
    name: kairos_ollama_storage