x-kairos-db-environment: &kairos-db-environment
  KAIROS_DB_BACKEND: postgresql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: kairos
  DB_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
  DB_NAME: kairos
  DB_HISTORICAL_NAME: kairos_historical

x-kairos-db-depends: &kairos-db-depends
  kairos_migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    container_name: kairos_postgres
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: kairos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos && pg_isready -U kairos -d kairos_historical"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-historical.sql:ro

  postgres_backup_worker:
    image: postgres:17-alpine
    container_name: kairos_postgres_backup_worker
    command: ["/bin/sh", "/scripts/postgres_backup_worker.sh"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: kairos
      PGPASSWORD: ${POSTGRES_PASSWORD:-kairos}
      DB_NAME: kairos
      DB_HISTORICAL_NAME: kairos_historical
      POSTGRES_BACKUP_INTERVAL_SECONDS: "86400"
      POSTGRES_BACKUP_RETENTION_DAYS: "14"
      POSTGRES_BACKUP_DIR: /backups
      POSTGRES_BACKUP_VERIFY_RESTORE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [kairos_net]
    volumes:
      - ./scripts/postgres_backup_worker.sh:/scripts/postgres_backup_worker.sh:ro
      - /mnt/storage2/kairos_postgres_backups:/backups

  kairos_migrate:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    build: .
    command: ["python", "-m", "database.migrate"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - kairos_net

  kairos:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos
    build: .
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # Sin esto, kairos.py corre una vez y termina -- en producción
      # queremos loop indefinido (ver kairos.py). 300s = 5 min entre scans;
      # un scan de tenis en vivo ya toma ~1-2 min (fetch de mercados +
      # prefetch paralelo de historial Flashscore), así que un intervalo
      # más corto encolaría scans sin necesidad.
      KAIROS_SCAN_INTERVAL_SECONDS: "300"
      # Estrategias financieras pausadas explícitamente. Activarlas exige
      # cambiar el flag, no editar/descomentar código.
      ENABLE_LIMIT_ARB: "false"
      ENABLE_MARKET_ARB: "false"
      ENABLE_BET_ON_FAVOURITE: "false"
      ENABLE_BET_ON_FAVOURITE_SHADOW: "true"
      # Las bases activa e histórica son bases PostgreSQL separadas.
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      # Volumen "definitivo": contabilidad operativa (LimitArbSignal hoy,
      # órdenes/fills/PnL más adelante).
      - kairos_data:/data
      # Volumen viejo rescatado: datos de referencia/histórica para
      # calibrar modelos (KalshiMarketTick/CryptoPriceSnapshot/TeamRating
      # reales, ver database/models_historical.py). Nadie escribe acá
      # todavía (sin collector/worker wireado) -- montado para que el
      # schema/conexión ya estén listos cuando se construya esa pieza.
      - kairos_data_historical:/data_historical
      # Disco externo (/mnt/storage2 en la mini-pc, confirmado por el
      # usuario 2026-07-31) montado read-only -- el motor solo CONSULTA
      # la data archivada (ver outer_apis/sports/tennis/
      # volatility_calibration.py), nunca escribe ahí (eso lo hace
      # únicamente tennis_history_archiver_worker).
      - /mnt/storage2/kairos_archive:/archive:ro

  tennis_history_archiver_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_history_archiver_worker
    build: .
    command: ["python", "-m", "workers.tennis_history_archiver_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 1h -- ver workers/tennis_history_archiver_worker.py, el chequeo
      # de tamaño de disco no necesita alta frecuencia.
      TENNIS_ARCHIVER_INTERVAL_SECONDS: "3600"
      TENNIS_ARCHIVE_DB_PATH: "/archive/kairos_tennis_archive.db"
      POSTGRES_DATA_MOUNT: "/postgres_data"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical
      - postgres_data:/postgres_data:ro
      # Este es el ÚNICO servicio con permiso de ESCRITURA en el disco
      # externo -- todo lo demás lo monta read-only.
      - /mnt/storage2/kairos_archive:/archive

  tennis_player_catalog_backfill_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_player_catalog_backfill_worker
    build: .
    # 2026-08-16, pedido explícito del usuario: "un worker que tenga
    # threads para backfillear los players que corra constantemente" --
    # ver workers/tennis_player_catalog_backfill_worker.py. Recorre el
    # catálogo COMPLETO de TennisExplorer (todos los países), no solo un
    # roster top-N -- una pasada completa toma del orden de días, corre
    # indefinidamente en background (idempotente, cada pasada solo
    # completa lo que falte).
    command: ["python", "-m", "workers.tennis_player_catalog_backfill_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # Threads en paralelo por jugador YA descubierto (el descubrimiento
      # del catálogo -- países/paginación -- sigue siendo secuencial a
      # propósito, ver docstring del worker). 4 = conservador para no
      # saturar el throttle real de TennisExplorer entre TODOS los
      # workers que ya lo comparten (tennis_match_history_sync_worker,
      # tennis_match_tick_worker).
      TENNIS_CATALOG_BACKFILL_MAX_WORKERS: "4"
      # 1h entre pasadas COMPLETAS del catálogo -- en la práctica casi
      # nunca se alcanza a disparar (una pasada real tarda mucho más),
      # solo importa si el catálogo ya está casi completo.
      TENNIS_CATALOG_BACKFILL_INTERVAL_SECONDS: "3600"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_weather_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_weather_worker
    build: .
    # 2026-08-16, pedido explícito del usuario: "un worker que haga
    # fetch de los datos climáticos, que revise cada 1 hora" -- ver
    # workers/tennis_weather_worker.py. Cierra un gap real:
    # MatchWeather.match_history existía como FK sin ningún productor.
    command: ["python", "-m", "workers.tennis_weather_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 1h -- pedido explícito del usuario.
      TENNIS_WEATHER_INTERVAL_SECONDS: "3600"
      # Partidos de MatchHistory por corrida: el histórico completo son
      # decenas de miles y Open-Meteo tiene cupo real por hora/día (ver
      # open_meteo.throttle_sleep) -- se completa de a tandas horarias.
      TENNIS_WEATHER_BATCH_LIMIT: "500"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_data_gap_filler_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_data_gap_filler_worker
    build: .
    # 2026-08-16, pedido explícito del usuario: "que sea reactivo ese
    # worker, que escanee qué datos faltan y en base a los fetch que
    # tenemos vaya llenando los datos que faltan" -- ver
    # workers/tennis_data_gap_filler_worker.py. Incremental, nunca
    # rehace el backfill (restricción explícita: "no podemos reiniciar").
    command: ["python", "-m", "workers.tennis_data_gap_filler_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      TENNIS_GAP_FILLER_INTERVAL_SECONDS: "3600"
      # Edades: sin red (puro cálculo), por eso el tope es alto.
      TENNIS_GAP_FILLER_AGES_LIMIT: "2000"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_match_stats_backfill_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_match_stats_backfill_worker
    build: .
    # Stats históricas en paralelo al gap filler: fetch real desde
    # Flashscore y tipado local del JSON/sets en el mismo ciclo propio.
    command: ["python", "-m", "workers.tennis_match_stats_backfill_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      TENNIS_STATS_BACKFILL_INTERVAL_SECONDS: "600"
      TENNIS_STATS_BACKFILL_LIMIT: "100"
      TENNIS_STATS_TYPED_BACKFILL_LIMIT: "500"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_match_duration_backfill_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_match_duration_backfill_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_duration_backfill_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      TENNIS_DURATION_BACKFILL_INTERVAL_SECONDS: "600"
      TENNIS_DURATION_BACKFILL_LIMIT: "100"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_player_bio_backfill_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_player_bio_backfill_worker
    build: .
    command: ["python", "-m", "workers.tennis_player_bio_backfill_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      TENNIS_BIO_BACKFILL_INTERVAL_SECONDS: "3600"
      TENNIS_BIO_BACKFILL_LIMIT: "40"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  tennis_tournament_metadata_backfill_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_tournament_metadata_backfill_worker
    build: .
    command: ["python", "-m", "workers.tennis_tournament_metadata_backfill_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      TENNIS_TOURNAMENT_BACKFILL_INTERVAL_SECONDS: "3600"
      TENNIS_TOURNAMENT_GEOCODE_LIMIT: "25"
      TENNIS_TOURNAMENT_REFINE_LIMIT: "30"
      # 2026-09-06, bug real: sin esto, Challenger/ITF (98.9% del
      # catálogo) nunca recibía `country` antes de geocodificar -- ver
      # docstring de `fill_tournament_country`.
      TENNIS_TOURNAMENT_COUNTRY_LIMIT: "30"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  tennis_self_elo_backfill_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_self_elo_backfill_worker
    build: .
    command: ["python", "-m", "workers.tennis_self_elo_backfill_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      TENNIS_SELF_ELO_INTERVAL_SECONDS: "21600"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  # Laboratorio offline de BetOnFavourite: persiste challengers y artefactos,
  # pero nunca cambia parámetros de producción ni ejecuta órdenes.
  tennis_ml_optimizer_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_ml_optimizer_worker
    build: .
    command: ["python", "-m", "workers.tennis_ml_optimizer_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      TENNIS_ML_OPTIMIZER_INTERVAL_SECONDS: "86400"
      TENNIS_ML_ARTIFACT_DIR: /data/ml/tennis
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]
    volumes:
      - kairos_data:/data

  brightdata_ip_watcher_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_brightdata_ip_watcher_worker
    build: .
    command: ["python", "-m", "workers.brightdata_ip_watcher_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 5min -- ver workers/brightdata_ip_watcher_worker.py. No necesita
      # ningún volumen (no toca DB, solo la API de BrightData + servicios
      # públicos de IP).
      BRIGHTDATA_WATCHER_INTERVAL_SECONDS: "300"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_match_tick_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_match_tick_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_tick_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 60s -- "minuto a minuto", pedido explícito del usuario. Ver
      # workers/tennis_match_tick_worker.py.
      TENNIS_TICK_INTERVAL_SECONDS: "60"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical
      # kairos_data (`db`/DB_PATH) -- 2026-08-11: la fusión con
      # set1_favorite_reaction_worker (2026-08-02) se REVIRTIÓ, pedido
      # explícito del usuario ("no lo usaremos de esa manera, más
      # adelante habrá un worker con ejecución real de estrategias").
      # El volumen sigue haciendo falta igual: `run_once` ahora chequea
      # el circuit-breaker global (`SystemHaltState`, ver
      # database/accounting/systemhaltstate.py, 2026-08-11).
      - kairos_data:/data

  tennis_match_history_sync_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_match_history_sync_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_history_sync_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      TENNIS_HISTORY_SYNC_SLEEP_S: "300"
      TENNIS_HISTORY_SYNC_BATCH_SIZE: "10"
      TENNIS_HISTORY_SYNC_STATS_LIMIT: "5"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net

  tennis_live_data_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_live_data_worker
    build: .
    command: ["python", "-m", "workers.tennis_live_data_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      # Independiente del tick de mercado: no lo bloquea. 2026-08-25,
      # pedido explícito del usuario -- bajado de 300s a 60s (5x más
      # resolución para el event-study de reacción del mercado) como
      # primer paso conservador; el batch selector ahora rota con
      # cursor (`take_rotating_batch`, ver tennis_live_data_worker.py)
      # así que ya no hace falta compensar starvation subiendo
      # BATCH_SIZE -- con 12/ciclo + rotación cubre los ~44 partidos
      # resueltos reales cada ~4 minutos en vez de nunca. Reevaluar si
      # 60s alcanza de resolución antes de bajar más (el piso real de
      # Flashscore es 0.5s/request COMPARTIDO con los workers de
      # backfill, no hay margen ilimitado).
      TENNIS_LIVE_DATA_INTERVAL_SECONDS: "60"
      TENNIS_LIVE_DATA_BATCH_SIZE: "12"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  tennis_set_tick_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_set_tick_worker
    build: .
    command: ["python", "-m", "workers.tennis_set_tick_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      # 2026-09-01, pedido explícito del usuario: precio real de
      # mercado "quién gana el set" (KXATPSETWINNER/KXWTASETWINNER),
      # ver workers/tennis_set_tick_worker.py. Mismo intervalo que
      # tennis_match_tick_worker (minuto a minuto).
      TENNIS_SET_TICK_INTERVAL_SECONDS: "60"
      TENNIS_SET_TICK_BATCH_SIZE: "40"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  tennis_match_timing_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_match_timing_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_timing_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      # 2026-09-05, pedido explícito del usuario: hora real de inicio/
      # fin de partidos recién finalizados (ver
      # workers/tennis_match_timing_worker.py). Intervalo más largo que
      # los workers en vivo -- la ventana de captura dura días, no
      # segundos, no hace falta correr cada minuto.
      TENNIS_MATCH_TIMING_INTERVAL_SECONDS: "300"
      TENNIS_MATCH_TIMING_BATCH_SIZE: "40"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  tennis_match_stats_orientation_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_tennis_match_stats_orientation_worker
    build: .
    command: ["python", "-m", "workers.tennis_match_stats_orientation_worker"]
    env_file: [.env]
    environment:
      <<: *kairos-db-environment
      TENNIS_STATS_ORIENTATION_INTERVAL_SECONDS: "1800"
      TENNIS_STATS_ORIENTATION_LIMIT: "25"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks: [kairos_net]

  market_arb_websocket_scanner:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_market_arb_websocket_scanner
    build: .
    # 2026-08-02, pedido explícito del usuario: "que el scan vaya
    # guardando las oportunidades market arb detectadas, mediante
    # websocket". Necesita /data/secrets/kalshi_key.pem (credenciales
    # reales de Kalshi, ver outer_apis/kalshi/auth.py) -- por eso monta
    # `kairos_data` (alias de kairos_data_v2), NO
    # kairos_data_historical. Solo lectura/registro, no coloca órdenes
    # -- línea roja del proyecto sin cambios.
    command: ["python", "-m", "workers.market_arb_websocket_scanner"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      MARKET_ARB_WS_REGISTRY_REFRESH_SECONDS: "900"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

  outcome_observer_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_outcome_observer_worker
    build: .
    command: ["python", "-m", "workers.outcome_observer_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 30min -- ver ventana de observación (2h-30d) documentada en el
      # docstring del worker; el intervalo del loop solo controla cada
      # cuánto se re-chequean señales YA elegibles, no la ventana en sí.
      OUTCOME_OBSERVER_INTERVAL_SECONDS: "1800"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data:/data

  historical_collector_worker:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_historical_collector_worker
    build: .
    command: ["python", "-m", "workers.historical_collector_worker"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 5min -- ticks/candles son time-sensitive (crypto_15m resuelve en
      # ~15min), ver workers/historical_collector_worker.py.
      HISTORICAL_COLLECTOR_INTERVAL_SECONDS: "300"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    volumes:
      - kairos_data_historical:/data_historical

  api:
    image: kairos:${KAIROS_IMAGE_TAG:?KAIROS_IMAGE_TAG must be set}
    container_name: kairos_api
    build: .
    command: ["python", "-m", "inner_api.server"]
    env_file:
      - .env
    environment:
      <<: *kairos-db-environment
      # 8765 -- puerto legacy pre-"extreme makeover" (había Flask acá
      # antes); otro proyecto del ecosistema (Aegis) ya tiene una
      # referencia apuntando acá, confirmado libre en la mini-pc (ver
      # inner_api/server.py module docstring).
      API_PORT: "8765"
    depends_on: *kairos-db-depends
    restart: unless-stopped
    networks:
      - kairos_net
    ports:
      - "8765:8765"
    volumes:
      - kairos_data:/data

networks:
  kairos_net:
    name: kairos_kairos_net

volumes:
  postgres_data:
    name: kairos_postgres_data
